name: Ingestion

on:
  schedule:
    # Twice a month: 1st and 15th, 04:00 UTC. GitHub may delay scheduled runs
    # by a few minutes under load — that's fine for this job.
    - cron: "0 4 1,15 * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: Run full ingestion pipeline (scrape + embed + soft-delete stale plans)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEARCH_PROVIDER: ${{ secrets.SEARCH_PROVIDER }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python main.py --mode full
