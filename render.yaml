services:
  - type: web
    name: agora-plan-recommender
    runtime: image
    image:
      url: ghcr.io/beloslavaa/agora-plan-recommender:latest
      creds: ghcr-agora-plan-recommender
    plan: free
    port: 8000
    envVars:
      - key: DATABASE_URL
        sync: false

# The ingestion schedule (scrape + embed + soft-delete stale plans, monthly)
# runs via GitHub Actions instead of a Render Cron Job — Render has no
# free tier for cron (billed per run), while GitHub Actions' scheduled
# workflows are free. See .github/workflows/ingestion.yml.
