services:
  - type: web
    name: agora-plan-recommender
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agora.backend.infrastructure.web.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false

# The ingestion schedule (scrape + embed + soft-delete stale plans, twice a
# month) runs via GitHub Actions instead of a Render Cron Job — Render has no
# free tier for cron (billed per run), while GitHub Actions' scheduled
# workflows are free. See .github/workflows/ingestion.yml.
