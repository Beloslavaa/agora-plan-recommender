services:
  - type: web
    name: agora-plan-recommender
    runtime: image
    image:
      url: ghcr.io/beloslavaa/agora-plan-recommender:latest
      creds: ghcr-agora-plan-recommender
    plan: free
    port: 8000
    envVars:
      - key: DATABASE_URL
        sync: false

# Fallback target only — the real deploy is Dokploy (see README). Note that
# neither scheduled job comes with this file: ingestion runs as a Dokploy
# Schedule Job exec'd into the deployed container, and source discovery runs
# in GitHub Actions (.github/workflows/ingestion.yml). If this Render deploy
# ever becomes the one serving traffic, ingestion needs re-homing — Render
# has no free cron tier.
